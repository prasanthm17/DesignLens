# Render blueprint for DesignLens — free tier.
#
# The free plan has no persistent disk, so SQLite lives in the container and the demo workspace is
# reseeded on every boot. That suits a portfolio demo: visitors always land on clean authored data
# and nothing private can accumulate. Trade-offs: the instance sleeps after ~15 min idle, and any
# changes a visitor makes are lost on restart.
services:
  - type: web
    name: designlens
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        value: /data/designlens.db
      - key: SESSION_SECRET
        generateValue: true
      - key: SKIP_DEMO_SEED
        value: "0"
